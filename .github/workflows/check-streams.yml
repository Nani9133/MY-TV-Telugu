name: Check Telugu stream manifests

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check HLS manifests
        run: python tools/check_streams.py
      - name: Publish health report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add health-report.csv
          git diff --cached --quiet || git commit -m "chore: refresh Telugu stream health report"
          git push
